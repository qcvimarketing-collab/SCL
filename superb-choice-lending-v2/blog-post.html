<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insight | Superb Choice Lending</title>
  <meta name="description" content="" id="meta-desc" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0E2A47" />

  <link rel="canonical" href="https://superbchoicelending.com/blog.html" id="canon-link" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="/assets/img/logo-horizontal.png" />
  <link rel="stylesheet" href="/assets/css/scl.css" />

  <style>
    .article-body {
      font-size: 17px;
      line-height: 1.85;
      color: var(--navy);
      font-weight: 300;
    }
    .article-body p { margin: 0 0 24px; }
    .article-body h2 { font-family: var(--font-display); font-size: 2rem; font-weight: 500; margin: 50px 0 18px; color: var(--navy); letter-spacing: -0.01em; }
    .article-body h3 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 500; margin: 36px 0 14px; color: var(--navy); }
    .article-body blockquote { border-left: 3px solid var(--gold); padding-left: 24px; margin: 30px 0; font-family: var(--font-display); font-style: italic; font-size: 1.3rem; color: var(--muted-strong); }
    .article-body a { color: var(--gold); text-decoration: underline; text-underline-offset: 3px; }
    .article-body ul, .article-body ol { padding-left: 24px; margin: 0 0 24px; }
    .article-body li { margin-bottom: 10px; }
    .article-body img { max-width: 100%; height: auto; border-radius: var(--radius); margin: 24px 0; }
    .article-body code { background: var(--ivory); padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
  </style>
</head>
<body class="texture-paper">
  <div data-scl-header></div>

  <main>
    <article id="article" style="padding: 50px 0 80px;">
      <div class="container" style="max-width: 760px;">
        <div id="loading" style="text-align: center; padding: 100px 0;">
          <span class="spinner" style="border-color: rgba(31,77,58,0.3); border-top-color: var(--forest); width: 22px; height: 22px;"></span>
          <p style="margin-top: 16px; font-size: 13px; color: var(--muted);">Loading…</p>
        </div>
        <div id="content" style="display:none;"></div>
      </div>
    </article>

    <!-- Related -->
    <section id="related-section" style="padding: 60px 0 80px; background: var(--ivory); display: none;">
      <div class="container">
        <div style="text-align: center; margin-bottom: 40px;">
          <div class="eyebrow" style="margin-bottom: 12px;">Continue Reading</div>
          <h2 class="h2">More <em class="italic-accent">Insights</em></h2>
          <div class="gold-divider-short" style="margin: 22px auto 0;"></div>
        </div>
        <div id="related-list" style="display: grid; grid-template-columns: 1fr; gap: 24px;" class="related-grid"></div>
        <style>
          @media (min-width: 768px) { .related-grid { grid-template-columns: repeat(3, 1fr) !important; } }
        </style>
      </div>
    </section>
  </main>

  <div data-scl-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="/assets/js/validation.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/seo.js" defer></script>
  <script src="/assets/js/partials.js" defer></script>
  <script src="/assets/js/scl-core.js" defer></script>

  <script>
    window.addEventListener('load', async () => {
      const params = new URLSearchParams(location.search);
      const slug = params.get('slug');
      const loading = document.getElementById('loading');
      const content = document.getElementById('content');

      if (!slug) {
        loading.innerHTML = `<p style="color: var(--muted);">No post specified. <a href="/blog.html" style="color: var(--gold);">Return to insights</a>.</p>`;
        return;
      }

      // Small delay for Supabase init
      await new Promise(r => setTimeout(r, 200));

      const result = await SCLBackend.getBlogPost(slug);
      if (!result.ok || !result.data) {
        loading.innerHTML = `<p style="color: var(--muted);">Post not found. <a href="/blog.html" style="color: var(--gold);">Return to insights</a>.</p>`;
        return;
      }

      const post = result.data;
      const fullUrl = `https://superbchoicelending.com/blog-post.html?slug=${slug}`;

      // Update meta
      document.title = `${post.title} | Superb Choice Lending`;
      document.getElementById('meta-desc').setAttribute('content', post.excerpt || '');
      document.getElementById('canon-link').setAttribute('href', fullUrl);

      // Inject Article JSON-LD
      if (window.SCLSeo) {
        window.SCLSeo.injectSchema(
          window.SCLSeo.getArticleSchema({ ...post, url: fullUrl }),
          window.SCLSeo.getBreadcrumbSchema([
            { name: 'Home', url: 'https://superbchoicelending.com/' },
            { name: 'Insights', url: 'https://superbchoicelending.com/blog.html' },
            { name: post.title, url: fullUrl },
          ])
        );
      }

      // Render
      const placeholderBody = post.content || `
        <p>This insight is part of our offline preview catalog. Once the Supabase backend is configured, the full essay content will be served here from the database.</p>
        <p>${post.excerpt}</p>
        <h2>Why This Matters</h2>
        <p>Demonstration content. Replace with real article body via Supabase admin panel.</p>
        <blockquote>"The best capital structure is the one that survives the deal that goes wrong, not the one that maximizes the deal that goes right."</blockquote>
        <p>This is sample article body content rendered as a placeholder. The Supabase <code>blog_posts.content</code> field will hold the real HTML or Markdown for each published essay.</p>
      `;

      content.innerHTML = `
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/index.html">Home</a>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          <a href="/blog.html">Insights</a>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          <span>${post.title}</span>
        </nav>

        <div style="text-align: center; margin: 40px 0 50px;">
          <div class="eyebrow" style="margin-bottom: 14px;">${post.category || 'Insight'}</div>
          <h1 class="h1" style="margin: 0 0 28px; font-size: clamp(2rem, 4vw + 1rem, 3.5rem);">${post.title}</h1>
          <div class="gold-divider-short" style="margin: 0 auto 22px;"></div>
          <div style="display: flex; gap: 16px; justify-content: center; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap;">
            <span>By ${post.author || 'Senior Advisory Desk'}</span>
            <span style="opacity: 0.4;">•</span>
            <span>${SCL.formatDate(post.published_at)}</span>
            <span style="opacity: 0.4;">•</span>
            <span>${post.read_time || 5} min read</span>
          </div>
        </div>

        ${post.cover_image
          ? `<img src="${post.cover_image}" alt="${post.title}" style="width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: var(--radius-lg); margin-bottom: 40px;"/>`
          : ''}

        <div class="article-body">${placeholderBody}</div>

        <div style="margin-top: 60px; padding: 30px; background: var(--ivory); border-radius: var(--radius-lg); text-align: center;">
          <div class="eyebrow" style="margin-bottom: 10px;">Need Capital?</div>
          <h3 class="h4" style="margin: 0 0 14px;">Speak With A Senior Advisor.</h3>
          <p style="font-size: 13.5px; color: var(--muted-strong); margin: 0 0 18px;">A confidential conversation with a senior member of our team.</p>
          <a href="/contact.html" class="btn btn-primary">Schedule Consultation</a>
        </div>
      `;

      loading.style.display = 'none';
      content.style.display = 'block';

      // Load related
      const relRes = await SCLBackend.getBlogPosts({ limit: 4 });
      if (relRes.ok && relRes.data && relRes.data.length > 1) {
        const related = relRes.data.filter(p => p.slug !== slug).slice(0, 3);
        document.getElementById('related-list').innerHTML = related.map(p => `
          <a href="/blog-post.html?slug=${p.slug}" class="loan-card" style="padding: 0; overflow: hidden;">
            <div style="aspect-ratio: 16/9; background: linear-gradient(135deg, var(--navy), var(--forest)); display: flex; align-items: center; justify-content: center; position: relative;">
              <div class="pattern-dots-gold" style="position:absolute; inset:0; opacity:0.4;"></div>
              <div style="position: relative; font-family: var(--font-display); font-style: italic; color: var(--gold-light); font-size: 1.2rem; padding: 16px;">${p.category || 'Insights'}</div>
            </div>
            <div style="padding: 20px;">
              <div class="eyebrow" style="margin-bottom: 10px;">${p.category || 'Insights'}</div>
              <h4 style="font-family: var(--font-display); font-size: 1.15rem; font-weight: 500; line-height: 1.3; margin: 0 0 8px; color: var(--navy);">${p.title}</h4>
              <p style="font-size: 12.5px; color: var(--muted); margin: 0;">${SCL.formatDate(p.published_at)}</p>
            </div>
          </a>
        `).join('');
        document.getElementById('related-section').style.display = 'block';
      }
    });
  </script>
</body>
</html>
