<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights | Superb Choice Lending</title>
  <meta name="description" content="Capital structure perspectives, market commentary, and operator-facing insights from the senior advisory desk at Superb Choice Lending." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0E2A47" />

  <meta property="og:title" content="Insights | Superb Choice Lending" />
  <meta property="og:description" content="Capital structure perspectives and market commentary." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://superbchoicelending.com/blog.html" />
  <meta property="og:image" content="https://superbchoicelending.com/assets/img/logo-horizontal.png" />

  <link rel="canonical" href="https://superbchoicelending.com/blog.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/png" href="/assets/img/logo-horizontal.png" />
  <link rel="stylesheet" href="/assets/css/scl.css" />
</head>
<body class="texture-paper">
  <div data-scl-header></div>

  <main>
    <section style="padding: 50px 0 30px;">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/index.html">Home</a>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
          <span>Insights</span>
        </nav>

        <div style="text-align: center; margin: 30px 0 50px; max-width: 720px; margin-left: auto; margin-right: auto;">
          <div class="eyebrow" style="margin-bottom: 14px;">From the Advisory Desk</div>
          <h1 class="h1">Insights & <em class="italic-accent">Perspectives.</em></h1>
          <div class="gold-divider-short" style="margin: 22px auto 24px;"></div>
          <p class="lede" style="margin: 0 auto;">
            Capital structure thinking, market commentary, and operator-facing analysis from our senior advisory team. Written for the few who read carefully.
          </p>
        </div>
      </div>
    </section>

    <section style="padding: 0 0 90px;">
      <div class="container">
        <div id="blog-list" style="display: grid; grid-template-columns: 1fr; gap: 28px;" class="blog-grid">
          <!-- Loading skeleton -->
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0;">
            <span class="spinner" style="border-color: rgba(31,77,58,0.3); border-top-color: var(--forest); width: 22px; height: 22px;"></span>
            <p style="margin-top: 16px; font-size: 13px; color: var(--muted);">Loading insights…</p>
          </div>
        </div>

        <style>
          @media (min-width: 640px) { .blog-grid { grid-template-columns: repeat(2, 1fr) !important; } }
          @media (min-width: 1024px) { .blog-grid { grid-template-columns: repeat(3, 1fr) !important; } }
        </style>
      </div>
    </section>
  </main>

  <div data-scl-footer></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="/assets/js/validation.js" defer></script>
  <script src="/assets/js/supabase-client.js" defer></script>
  <script src="/assets/js/seo.js" defer></script>
  <script src="/assets/js/partials.js" defer></script>
  <script src="/assets/js/scl-core.js" defer></script>

  <script>
    window.addEventListener('load', async () => {
      // Small delay so Supabase init has a chance
      await new Promise(r => setTimeout(r, 200));
      const list = document.getElementById('blog-list');
      const result = await SCLBackend.getBlogPosts({ limit: 24 });

      if (!result.ok || !result.data || result.data.length === 0) {
        list.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 0;">
            <p style="font-size: 14px; color: var(--muted);">No posts yet. Check back soon.</p>
          </div>`;
        return;
      }

      list.innerHTML = result.data.map(post => `
        <a href="/blog-post.html?slug=${encodeURIComponent(post.slug)}" class="loan-card" style="padding: 0; overflow: hidden;">
          <div style="aspect-ratio: 16/9; background: linear-gradient(135deg, var(--navy), var(--forest)); position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;">
            ${post.cover_image
              ? `<img src="${post.cover_image}" alt="" style="width:100%; height:100%; object-fit:cover;" loading="lazy"/>`
              : `<div class="pattern-dots-gold" style="position:absolute; inset:0; opacity:0.4;"></div>
                 <div style="position: relative; font-family: var(--font-display); font-style: italic; color: var(--gold-light); font-size: 1.6rem; text-align: center; padding: 20px;">${post.category || 'Insights'}</div>`
            }
          </div>
          <div style="padding: 24px;">
            <div class="eyebrow" style="margin-bottom: 12px;">${post.category || 'Insights'}</div>
            <h3 style="font-family: var(--font-display); font-size: 1.4rem; font-weight: 500; line-height: 1.25; margin: 0 0 12px; color: var(--navy);">${post.title}</h3>
            <p style="font-size: 13.5px; color: var(--muted-strong); line-height: 1.6; margin: 0 0 16px;">${post.excerpt}</p>
            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--hairline-soft); font-size: 11px; color: var(--muted);">
              <span>${SCL.formatDate(post.published_at)}</span>
              <span>${post.read_time || 5} min read</span>
            </div>
          </div>
        </a>
      `).join('');

      if (result.offline) {
        const banner = document.createElement('div');
        banner.style.cssText = 'grid-column: 1/-1; padding: 12px 18px; background: rgba(184,137,62,0.08); border: 1px solid rgba(184,137,62,0.3); border-radius: var(--radius); font-size: 12px; color: var(--muted-strong); text-align: center; margin-bottom: 20px;';
        banner.textContent = 'Demo posts shown — configure Supabase to manage real blog content.';
        list.insertBefore(banner, list.firstChild);
      }
    });
  </script>
</body>
</html>
